name: Node.js CI/CD Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: thenuva-x-md-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # CHECKOUT REPOSITORY
      - name: Checkout repository
        uses: actions/checkout@v4

      # NODE.JS
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # SYSTEM DEPENDENCIES
      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "ImageMagick:"
          magick -version | head -n 1 || convert -version | head -n 1

      # NODE DEPENDENCIES
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ENVIRONMENT CHECK
      - name: Verify environment
        run: |
          node --version
          npm --version

          if [ ! -f index.js ]; then
            echo "ERROR: index.js not found"
            exit 1
          fi

          echo "THENUVA X MD environment ready"

      # SESSION CHECK
      - name: Check SESSION_ID
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID secret is missing"
            exit 1
          fi

          echo "SESSION_ID is configured"

      # START BOT
      - name: Start THENUVA X MD
        env:
          # WHATSAPP SESSION
          SESSION_ID: ${{ secrets.SESSION_ID }}

          # GITHUB CONFIGURATION
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_WORKFLOW_FILE: main.yml
          GITHUB_BRANCH: main

          # DAVID CYRIL API
          DAVIDCYRIL_API_KEY: ${{ secrets.DAVIDCYRIL_API_KEY }}

          # SASA DEV TTS API
          SASA_TTS_API_KEY: ${{ secrets.SASA_TTS_API_KEY }}

          # SASA DEV YOUTUBE MP4 API
          SASA_YTMP4_API_KEY: ${{ secrets.SASA_YTMP4_API_KEY }}

        run: |
          echo "Starting THENUVA X MD..."
          node index.js
