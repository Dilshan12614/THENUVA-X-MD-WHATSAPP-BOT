name: Node.js CI/CD Workflow

on:
  push:
    branches:
      - add-menu-bottons

  pull_request:
    branches:
      - add-menu-bottons

  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: thenuva-x-md-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Start THENUVA X MD
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2. SETUP NODE.JS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. CHECK PROJECT FILES
      - name: Check project files
        run: |
          echo "================================"
          echo "THENUVA X MD"
          echo "================================"

          echo "Branch: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          if [ ! -f index.js ]; then
            echo "ERROR: index.js not found"
            exit 1
          fi

          echo "Project files found"

      # 4. INSTALL SYSTEM DEPENDENCIES
      - name: Install FFmpeg and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

          echo "Checking FFmpeg..."
          ffmpeg -version | head -n 1

          echo "Checking FFprobe..."
          ffprobe -version | head -n 1

          echo "Checking ImageMagick..."
          convert -version | head -n 1

      # 5. INSTALL NODE MODULES
      - name: Install Node dependencies
        run: |
          node --version
          npm --version
          npm install --legacy-peer-deps

      # 6. VERIFY SESSION
      - name: Verify SESSION_ID
        if: github.event_name != 'pull_request'
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
        run: |
          if [ -z "$SESSION_ID" ]; then
            echo "ERROR: SESSION_ID secret is missing"
            exit 1
          fi

          echo "SESSION_ID is configured"

      # 7. START BOT
      - name: Start THENUVA X MD
        if: github.event_name != 'pull_request'
        env:
          SESSION_ID: ${{ secrets.SESSION_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_WORKFLOW_FILE: main.yml
          GH_BRANCH: add-menu-bottons
        run: |
          echo "================================"
          echo "Starting THENUVA X MD..."
          echo "================================"

          node index.js
