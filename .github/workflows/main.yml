name: Node.js CI/CD Workflow

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix:
        node-version: [20.x]

    env:
      SESSION_ID: ${{ secrets.SESSION_ID }}
      SASA_API_KEY: ${{ secrets.SASA_API_KEY }}

    steps:

      # ─────────────────────────────
      # CHECKOUT
      # ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4


      # ─────────────────────────────
      # NODE.JS
      # ─────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm


      # ─────────────────────────────
      # INSTALL DEPENDENCIES
      # ─────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps


      # ─────────────────────────────
      # FFmpeg + ImageMagick
      # ─────────────────────────────
      - name: Install FFmpeg & ImageMagick
        run: |
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --fix-missing ffmpeg imagemagick


      # ─────────────────────────────
      # CHECK SESSION ID
      # ─────────────────────────────
      - name: Check SESSION_ID
        run: |
          if [ -z "$SESSION_ID" ]; then
            echo "❌ SESSION_ID is missing"
            exit 1
          fi

          echo "✅ SESSION_ID is set"


      # ─────────────────────────────
      # CHECK SASA API KEY
      # ─────────────────────────────
      - name: Check SASA API Key
        run: |
          if [ -z "$SASA_API_KEY" ]; then
            echo "❌ SASA_API_KEY is missing"
            exit 1
          fi

          echo "✅ SASA_API_KEY is set"


      # ─────────────────────────────
      # START BOT
      # ─────────────────────────────
      - name: Start application
        run: node index.js
